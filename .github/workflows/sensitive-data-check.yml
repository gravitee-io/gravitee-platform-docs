# Sensitive Data Check
#
# Blocks PRs whose commit messages, title, or description contain customer names,
# contact names, emails, or internal tool console URLs (critical rule 36, SOC 2/GDPR).
#
# Runs the same script as the local .githooks/commit-msg hook, so a developer who
# installed the hook sees identical results before pushing. CI is the enforcing gate,
# because a local hook can be skipped with --no-verify.

name: Sensitive Data Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan every commit message in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          chmod +x .githooks/commit-msg
          fail=0
          # Merge commits carry no author-written prose, so skip them.
          for sha in $(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            if ! .githooks/commit-msg /tmp/msg.txt; then
              echo "  ^ in commit $sha: $(git log -1 --format=%s "$sha")"
              fail=1
            fi
          done
          exit $fail

      - name: Scan the PR title and description
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          chmod +x .githooks/commit-msg
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > /tmp/pr.txt
          if ! .githooks/commit-msg /tmp/pr.txt; then
            echo "  ^ in the PR title or description"
            exit 1
          fi
