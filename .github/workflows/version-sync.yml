# Version Sync Action
#
# Automatically syncs changes from docs/{product}/{current_version}/
# to docs/{product}/{next_version}/ when files change on main.
#
# Creates a PR (instead of pushing directly) to respect branch protection.
# Every run is a full sync of current -> next: files listed in the next
# version's .version-overrides (and every .gitbook.yaml) are left alone,
# Markdown bodies are copied with the next version's front matter kept,
# and new files are added. Nothing is ever deleted.
#
# Token: the built-in GITHUB_TOKEN. The previous VERSION_SYNC_TOKEN was a
# personal access token whose owner lost write access, so every run from
# 2026-08-05 to 2026-11-04 failed at the push with a 403 and no sync PR was
# created (DOC-1967). The repository allows Actions to create pull requests.
# Pull requests opened with GITHUB_TOKEN don't trigger the pull_request
# workflows (Vale, overrides lint), so review the sync PR by eye; it still
# auto-merges once it has the approving review the branch protection needs.
#
# Manual run: Actions > Version Sync > Run workflow does a full sync of every
# pair in the matrix (use it once after moving the pair).
#
# The pair below matches .github/workflows/lint-overrides.yml: move both
# together at each version cutover.

name: Version Sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/apim/4.13/**'
      - 'docs/am/4.13/**'
      - 'docs/gko/4.13/**'
  workflow_dispatch:

# Grant write access so the bot can create branches and PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - product: apim
            current: "4.13"
            next: "4.14"
          - product: am
            current: "4.13"
            next: "4.14"
          - product: gko
            current: "4.13"
            next: "4.14"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history — GitBook may push multi-commit batches

      - name: Get changed files
        id: changes
        run: |
          # Get files changed in this push (relative to docs/{product}/{version}/)
          PREFIX="docs/${{ matrix.product }}/${{ matrix.current }}/"
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ]; then
            echo "Manual run — full sync."
            echo "skip=false" >> $GITHUB_OUTPUT
          # Detect initial push (before = all-zeros)
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push detected — skipping sync."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            git diff --name-only "$BEFORE" HEAD -- "$PREFIX" | sed "s|^$PREFIX||" > /tmp/changed_files.txt
            if [ ! -s /tmp/changed_files.txt ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "Changed files:"
              cat /tmp/changed_files.txt
            fi
          fi

      - name: Check next version exists
        if: steps.changes.outputs.skip == 'false'
        id: check
        run: |
          NEXT_DIR="docs/${{ matrix.product }}/${{ matrix.next }}"
          if [ -d "$NEXT_DIR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Next version directory $NEXT_DIR does not exist. Skipping sync."
          fi

      - name: Set up Python
        if: steps.changes.outputs.skip == 'false' && steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync
        if: steps.changes.outputs.skip == 'false' && steps.check.outputs.exists == 'true'
        id: sync
        run: |
          python .github/scripts/prune_overrides.py \
            . \
            ${{ matrix.product }} \
            ${{ matrix.current }} \
            ${{ matrix.next }}
          python .github/scripts/sync_versions.py \
            . \
            ${{ matrix.product }} \
            ${{ matrix.current }} \
            ${{ matrix.next }}
          # Check if sync actually produced diffs (for PR gate)
          # git diff catches modified tracked files; git ls-files catches new untracked files
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create sync PR
        if: steps.sync.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          commit-message: "[sync] ${{ matrix.product }}: ${{ matrix.current }} → ${{ matrix.next }}"
          title: "[sync] ${{ matrix.product }}: ${{ matrix.current }} → ${{ matrix.next }}"
          body: |
            Auto-synced changes from `docs/${{ matrix.product }}/${{ matrix.current }}/` to `docs/${{ matrix.product }}/${{ matrix.next }}/`.

            Triggered by push to `main` (${{ github.sha }}).
          branch: "sync/${{ matrix.product }}-${{ matrix.current }}-to-${{ matrix.next }}"
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        # The PR is already open at this point: a refusal here only means it has to be merged by hand.
        continue-on-error: true
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
