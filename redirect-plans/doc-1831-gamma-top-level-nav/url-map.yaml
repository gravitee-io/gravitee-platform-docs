# Candidates only. Every entry needs a product decision before any page-level map is
# generated. Wildcards are shorthand for the URL set, not ready-to-apply rules.
tier_3_legacy_sections:
  - from: "/apim/*"
    to: "/api-management"
    status: candidate
    note: >-
      Kafka Gateway subtree candidate: /event-stream-management. Agent mesh and MCP subtree candidate: /agent-management. Page-level map generated at content-parity time.
  - from: "/am/*"
    status: pending-decision
    note: >-
      Authorization Management covers policy authorization (PDP and PEP). AM covers identity concerns (identity providers, MFA, OAuth and OpenID Connect). Candidate homes: /authorization-management with an identity area, /platform-management, or AM stays a published section until a Gamma identity home exists.
  - from: "/gravitee-cloud/*"
    to: "/platform-management"
    status: candidate
    note: >-
      Control plane, organizations, and environments concern.
  - from: "/gravitee-kubernetes-operator-gko/*"
    to: "/api-management"
    status: candidate
    note: >-
      Deploy tooling for API resources. Alternative candidate: /platform-management.
  - from: "/edge-stack/*"
    status: pending-decision
    note: >-
      Not /edge-management by default: the Gamma Edge Management module documents the edge daemon surface (connect, enrollment, observe), while Edge Stack is an ingress product.
